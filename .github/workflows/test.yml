name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Cover every package on every supported Python version. Real-model
  # integration runs separately below.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package: [mcp, rag, dashboard, stack]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install + run ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          uv sync --locked --python ${{ matrix.python-version }} --extra test
          uv run --locked --python ${{ matrix.python-version }} pytest --ignore=tests/test_integration.py

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Audit the locked dependency graph, including optional extras
        run: |
          uv export --locked --all-packages --all-extras --no-emit-workspace --no-hashes --output-file requirements-audit.txt
          uvx --python ${{ matrix.python-version }} pip-audit --no-deps --disable-pip --requirement requirements-audit.txt

  # End-to-end integration — real lens subprocess + real MCP tool calls.
  # Runs only on 3.12 because it's slower (MiniLM first-run download).
  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-MiniLM-L6-v2
      - name: Install stack with full extras
        working-directory: packages/stack
        run: uv sync --locked --python 3.12 --extra test --extra full
      - name: Run integration tests
        working-directory: packages/stack
        run: uv run --locked --python 3.12 pytest -v
        timeout-minutes: 10
