version: 2
updates:
  # uv manages all four packages and their shared lockfile at the root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # MCP 2 removed mcp.server.fastmcp. Keep v1 until the adapter migrates.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
