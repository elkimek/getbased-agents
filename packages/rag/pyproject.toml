[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbased-rag"
version = "0.8.1"
description = "getbased-rag — standalone RAG knowledge server (formerly the Electron-bundled Lens)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-multipart>=0.0.32",
    # Security floors for transitive dependencies also apply to PyPI installs,
    # which do not consume this workspace's uv.lock.
    "certifi>=2026.10.18",
    "filelock>=4.2.7",
    "setuptools>=84.2.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=6.21.4"]
docx = ["python-docx>=1.0"]
# ONNX acceleration. `full` now includes it by default — the install
# is small (~200 MB vs the old ~2 GB) because we load pre-exported
# ONNX weights from HuggingFace directly, skipping optimum and the
# PyTorch→ONNX conversion step. Three pure-Python/native deps:
#   - onnxruntime  (inference, ~100 MB CPU build)
#   - huggingface-hub  (model download, ~2 MB)
#   - tokenizers  (Rust-backed fast tokenizer, ~5 MB)
# Install without ONNX (fall back to sentence-transformers / PyTorch
# CPU): `pip install getbased-rag`. The sentence-transformers dep
# already in core gets you the default LocalEmbedder path — ~2-3x
# slower than ONNX but zero extra config.
full = [
    "pypdf>=6.21.4",
    "python-docx>=1.0",
    "onnxruntime>=1.31.1",
    "huggingface-hub>=2.3.0",
    "tokenizers>=0.23.3",
]
test = ["pytest>=9.2.0", "httpx>=0.27"]

[project.scripts]
lens = "lens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
