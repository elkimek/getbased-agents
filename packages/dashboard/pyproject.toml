[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbased-dashboard"
version = "0.7.0"
description = "Web dashboard for getbased-agents — manage knowledge libraries, generate MCP client configs, inspect agent activity"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.27",
    "typer>=0.27.3",
    "python-multipart>=0.0.32",
    "getbased-mcp>=0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-asyncio>=0.23", "respx>=0.21", "httpx>=0.27"]

[project.scripts]
getbased-dashboard = "getbased_dashboard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
getbased_dashboard = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
